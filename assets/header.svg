<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
    <stop offset="0" stop-color="#D6A54A" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#D6A54A" stop-opacity="0"/>
  </radialGradient>
  <pattern id="rules" width="1200" height="42" patternUnits="userSpaceOnUse">
    <line x1="0" y1="41.5" x2="1200" y2="41.5" stroke="#EEE4D2" stroke-opacity="0.025"/>
  </pattern>
  <clipPath id="f"><rect width="1200" height="420" rx="18"/></clipPath>
</defs>
<style>
@font-face { font-family: 'Fraunces Display'; src: url(data:font/woff;base64,) format('woff'); }
@font-face { font-family: 'Fraunces Accent'; src: url(data:font/woff;base64,) format('woff'); }
@font-face { font-family: 'Archivo'; src: url(data:font/woff;base64,) format('woff'); }
@font-face { font-family: 'Martian Mono'; src: url(data:font/woff;base64,) format('woff'); }
.d { font-family: 'Fraunces Display', Georgia, serif; }
.a { font-family: 'Fraunces Accent', Georgia, serif; font-style: italic; }
.b { font-family: 'Archivo', system-ui, sans-serif; }
.m { font-family: 'Martian Mono', ui-monospace, monospace; }
.up { opacity: 0; animation: up 1s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.rule { transform-origin: 64px 0; transform: scaleX(0); animation: draw 1.6s cubic-bezier(.2,.7,.2,1) .9s forwards; }
@keyframes draw { to { transform: scaleX(1); } }
.pulse { animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
</style>
<g clip-path="url(#f)">
  <rect width="1200" height="420" fill="#120D09"/>
  <rect width="1200" height="420" fill="url(#rules)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="none" stroke="#2F261E"/>

  <g class="up" style="animation-delay:.1s">
    <rect x="64" y="66" width="8" height="8" fill="#D6A54A" class="pulse"/>
    <text x="86" y="75" class="m" font-size="12" letter-spacing="2.6" fill="#A0917C">COMPUTER SCIENCE · OAKLAND UNIVERSITY</text>
  </g>

  <text x="58" y="210" class="up" style="animation-delay:.25s" font-size="128" letter-spacing="-3" fill="#EEE4D2">
    <tspan class="d">Jasman </tspan><tspan class="a" fill="#D6A54A">Sidhu</tspan>
  </text>

  <g class="up b" style="animation-delay:.45s" font-size="22" fill="#A0917C">
    <text x="64" y="272">I build practical AI products: agents that take real actions,</text>
    <text x="64" y="302">and apps people actually use.</text>
  </g>

  <line class="rule" x1="64" y1="352.5" x2="1136" y2="352.5" stroke="#D6A54A" stroke-opacity=".55"/>
  <g class="up m" style="animation-delay:1.1s" font-size="11" letter-spacing="2.4" fill="#A0917C">
    <text x="64" y="380">AGENTS / WEB / iOS</text>
    <text x="1136" y="380" text-anchor="end">STERLING HEIGHTS, MI</text>
  </g>
</g>
</svg>