<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#C8FF2E"/>
      <animateTransform attributeName="patternTransform" type="translate" additive="sum" from="0 0" to="28 0" dur="2.4s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EDEFEA" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#0A0B0C"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- tag -->
    <rect x="64" y="72" width="262" height="30" fill="#C8FF2E"/>
    <text x="80" y="92" class="mono" font-size="13" letter-spacing="2.6" fill="#0A0B0C">CS · OAKLAND UNIVERSITY</text>

    <!-- name -->
    <text x="58" y="210" class="sans" font-size="112" font-weight="800" letter-spacing="-3" fill="#EDEFEA">JASMAN SIDHU</text>

    <!-- line -->
    <text x="64" y="262" class="mono" font-size="15" letter-spacing="1.8" fill="#EDEFEA" fill-opacity="0.55">BUILDING PRACTICAL AI PRODUCTS — STERLING HEIGHTS, MI</text>
    <rect x="662" y="249" width="9" height="16" fill="#C8FF2E" class="caret"/>

    <!-- index, right -->
    <text x="1136" y="92" class="mono" font-size="12" letter-spacing="2" fill="#EDEFEA" fill-opacity="0.4" text-anchor="end">AGENTS / WEB / iOS</text>

    <!-- hazard strip -->
    <rect x="0" y="340" width="1200" height="14" fill="url(#hazard)"/>
  </g>
</svg>
