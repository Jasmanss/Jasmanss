<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="1" stop-color="#0d1020"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <style>
    .fade { opacity: 0; animation: in .9s ease-out forwards; }
    .d1 { animation-delay: .2s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.2s } .d4 { animation-delay: 1.7s }
    @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .caret { animation: blink 1s steps(1) infinite }
    @keyframes blink { 50% { opacity: 0 } }
    .type { clip-path: inset(0 100% 0 0); animation: type 2.4s steps(44) 1.9s forwards }
    @keyframes type { to { clip-path: inset(0 0 0 0) } }
    .pulse { animation: pulse 2.4s ease-in-out infinite }
    @keyframes pulse { 50% { opacity: .35 } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <circle cx="980" cy="60" r="260" fill="url(#orbA)">
      <animate attributeName="cx" values="980;900;980" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="320" r="240" fill="url(#orbB)">
      <animate attributeName="cx" values="200;300;200" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- window chrome -->
    <g class="fade">
      <circle cx="48" cy="44" r="7" fill="#ff5f57"/>
      <circle cx="72" cy="44" r="7" fill="#febc2e"/>
      <circle cx="96" cy="44" r="7" fill="#28c840"/>
      <text x="124" y="49" font-size="14" fill="#8b93a7">~/jasmanss — zsh</text>
    </g>

    <text x="48" y="112" font-size="18" fill="#8b93a7" class="fade d1">$ whoami</text>

    <text x="46" y="182" font-size="68" font-weight="700" fill="url(#name)" letter-spacing="-2"
          font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" class="fade d2">Jasman Sidhu</text>

    <text x="48" y="224" font-size="20" fill="#c9d1e4" class="fade d3">CS @ Oakland University · building practical AI products</text>

    <g class="fade d4">
      <text x="48" y="276" font-size="18" fill="#28c840">❯</text>
      <text x="72" y="276" font-size="18" fill="#e6e9f2" class="type">ship things people actually use</text>
      <rect x="72" y="262" width="10" height="18" fill="#a78bfa" class="caret">
        <animate attributeName="x" values="72;72;418" keyTimes="0;0.44;1" dur="4.3s" fill="freeze"/>
      </rect>
    </g>

    <!-- status pill -->
    <g class="fade d3" transform="translate(912 262)">
      <rect width="240" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="22" cy="18" r="5" fill="#28c840" class="pulse"/>
      <text x="38" y="23" font-size="14" fill="#c9d1e4">open to internships</text>
    </g>
  </g>
</svg>
