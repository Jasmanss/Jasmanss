name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0A0B0C&color_dots=#ebedf0,#e4f7a8,#d4fb6a,#c8ff2e,#9ccc12
            dist/snake-dark.svg?palette=github-dark&color_snake=#C8FF2E&color_dots=#161b22,#2c3a0c,#4f6b12,#8fb81f,#c8ff2e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
